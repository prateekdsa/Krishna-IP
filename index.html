<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Public School - Online Examination Portal</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b);
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 255, 255, 0.3);
            --text-color: #0f172a;
            --input-bg: #ffffff;
            --input-border: #cbd5e1;
            --primary-blue: #2563eb;
            --primary-hover: #1d4ed8;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #020617, #0f172a);
            --card-bg: rgba(15, 23, 42, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --input-bg: #1e293b;
            --input-border: #334155;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
        }

        * { box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-color);
        }

        /* Top Header & Widget Bar */
        .top-bar {
            width: 100%;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        .theme-toggle {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        /* Glassmorphism Card Container */
        .portal-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: var(--shadow);
            margin: auto;
        }

        .school-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .school-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .role-btn.active {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        
        input, select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-color);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover { background: var(--primary-hover); }

        /* Dashboard Styles */
        .dashboard { display: none; width: 100%; max-width: 900px; margin: 20px auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .paper-item { background: var(--card-bg); backdrop-filter: blur(8px); padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-live { background: #dcfce7; color: #15803d; }
        .status-scheduled { background: #fef3c7; color: #b45309; }
        .status-delisted { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body data-theme="light">

    <!-- Top Header -->
    <div class="top-bar">
        <div>
            <strong id="school-title">CITY PUBLIC SCHOOL, NAJIBABAD</strong>
            <div id="live-clock" style="font-size: 13px; opacity: 0.8;"></div>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Toggle Dark Mode</button>
    </div>

    <!-- Login View -->
    <div class="portal-card" id="login-view">
        <div class="school-header">
            <span class="school-badge">VERIFIED PORTAL</span>
            <h2 style="margin: 5px 0;" id="greeting">Online Examination Portal</h2>
            <p style="font-size: 13px; opacity: 0.7;">Select your role to access your account</p>
        </div>

        <div class="role-selector">
            <button class="role-btn active" onclick="setRole('Student')">Student</button>
            <button class="role-btn" onclick="setRole('Teacher')">Teacher</button>
            <button class="role-btn" onclick="setRole('Admin')">Admin</button>
        </div>

        <div class="form-group">
            <label id="user-label">Full Name / Login ID</label>
            <input type="text" placeholder="Enter Full Name, ID, or Key">
        </div>

        <div id="student-fields">
            <div class="form-group">
                <label>Select Class & Section</label>
                <select>
                    <option>Class 9th - Section A</option>
                    <option>Class 10th - Section A</option>
                </select>
            </div>
            <div class="form-group">
                <label>Select Subject</label>
                <select>
                    <option>Physics</option>
                    <option>Mathematics</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password">
        </div>

        <button class="btn-submit" onclick="login()">Login & Proceed</button>
    </div>

    <!-- Teacher Panel (Upload & Schedule Management) -->
    <div class="dashboard" id="teacher-view">
        <div class="dashboard-header">
            <h2>Teacher Assessment Panel</h2>
            <button class="btn-submit" style="width: auto; padding: 8px 16px;" onclick="logout()">Logout</button>
        </div>

        <div class="portal-card" style="max-width: 100%; margin-bottom: 25px;">
            <h3>Upload Question Paper</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <div class="form-group">
                    <label>Paper Title</label>
                    <input type="text" id="paper-title" placeholder="e.g. Class 9th Physics Mid-Term">
                </div>
                <div class="form-group">
                    <label>Select PDF File</label>
                    <input type="file" id="paper-file" accept=".pdf">
                </div>
                <div class="form-group">
                    <label>Go-Live Time (Start)</label>
                    <input type="datetime-local" id="start-time">
                </div>
                <div class="form-group">
                    <label>Auto-Delist Time (End)</label>
                    <input type="datetime-local" id="end-time">
                </div>
            </div>
            <button class="btn-submit" onclick="uploadPaper()">Upload and Schedule Test</button>
        </div>

        <h3>Uploaded Tests Dashboard</h3>
        <div id="paper-list"></div>
    </div>

    <!-- Student Exam Panel -->
    <div class="dashboard" id="student-view">
        <div class="dashboard-header">
            <h2>Class 9th - Student Dashboard</h2>
            <button class="btn-submit" style="width: auto; padding: 8px 16px;" onclick="logout()">Logout</button>
        </div>

        <h3>Available Physics Exams</h3>
        <div id="student-paper-list"></div>
    </div>

    <script>
        let currentRole = 'Student';
        let questionPapers = [];

        // Real-Time Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleString();
            renderPapers(); // Dynamic check for schedule updates
        }, 1000);

        function toggleTheme() {
            const body = document.body;
            const newTheme = body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
        }

        function setRole(role) {
            currentRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('student-fields').style.display = role === 'Student' ? 'block' : 'none';
        }

        function login() {
            document.getElementById('login-view').style.display = 'none';
            if (currentRole === 'Teacher' || currentRole === 'Admin') {
                document.getElementById('teacher-view').style.display = 'block';
            } else {
                document.getElementById('student-view').style.display = 'block';
            }
            renderPapers();
        }

        function logout() {
            document.getElementById('teacher-view').style.display = 'none';
            document.getElementById('student-view').style.display = 'none';
            document.getElementById('login-view').style.display = 'block';
        }

        function uploadPaper() {
            const title = document.getElementById('paper-title').value;
            const fileInput = document.getElementById('paper-file');
            const startTime = document.getElementById('start-time').value;
            const endTime = document.getElementById('end-time').value;

            if (!title || !fileInput.files[0] || !startTime || !endTime) {
                alert('Please fill out all upload & schedule details!');
                return;
            }

            const newPaper = {
                id: Date.now(),
                title: title,
                fileName: fileInput.files[0].name,
                startTime: new Date(startTime).getTime(),
                endTime: new Date(endTime).getTime(),
                manualDelist: false
            };

            questionPapers.push(newPaper);
            alert('Question paper uploaded and scheduled successfully!');
            renderPapers();
        }

        function toggleManualDelist(id) {
            const paper = questionPapers.find(p => p.id === id);
            if (paper) {
                paper.manualDelist = !paper.manualDelist;
                renderPapers();
            }
        }

        function renderPapers() {
            const now = Date.now();
            const teacherList = document.getElementById('paper-list');
            const studentList = document.getElementById('student-paper-list');

            if (teacherList) teacherList.innerHTML = '';
            if (studentList) studentList.innerHTML = '';

            questionPapers.forEach(paper => {
                const isLive = !paper.manualDelist && now >= paper.startTime && now <= paper.endTime;
                const isExpired = now > paper.endTime;

                let statusLabel = isLive ? 'LIVE' : (isExpired ? 'EXPIRED' : 'SCHEDULED');
                if (paper.manualDelist) statusLabel = 'DELISTED (MANUAL)';

                let badgeClass = isLive ? 'status-live' : (isExpired || paper.manualDelist ? 'status-delisted' : 'status-scheduled');

                // Render for Teacher Panel
                if (teacherList) {
                    teacherList.innerHTML += `
                        <div class="paper-item">
                            <div>
                                <strong>${paper.title}</strong> (${paper.fileName})<br>
                                <small>Starts: ${new Date(paper.startTime).toLocaleString()} | Ends: ${new Date(paper.endTime).toLocaleString()}</small>
                            </div>
                            <div>
                                <span class="status-badge ${badgeClass}">${statusLabel}</span>
                                <button onclick="toggleManualDelist(${paper.id})" style="margin-left: 10px; cursor: pointer;">
                                    ${paper.manualDelist ? 'Relist Test' : 'Force Delist'}
                                </button>
                            </div>
                        </div>
                    `;
                }

                // Render for Student Panel
                if (studentList) {
                    if (isLive) {
                        studentList.innerHTML += `
                            <div class="paper-item">
                                <div>
                                    <strong>${paper.title}</strong><br>
                                    <small>Ends at: ${new Date(paper.endTime).toLocaleTimeString()}</small>
                                </div>
                                <button class="btn-submit" style="width: auto; padding: 6px 12px;">Start Exam Now</button>
                            </div>
                        `;
                    }
                }
            });

            if (studentList && studentList.innerHTML === '') {
                studentList.innerHTML = '<p style="opacity: 0.7;">No active exams available at this moment.</p>';
            }
        }
    </script>
</body>
</html>
