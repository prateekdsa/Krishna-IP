<script>
    const TEACHER_PHONE = "917055202223"; 
    const MASTER_TEACHER_PASSWORD = "Admin@7055"; 

    let allClassData = null;
    let quizData = []; 
    let userAnswers = [];
    let currentQuestionIdx = 0;
    let studentName = "";
    let studentRoll = "";
    let selectedClassLabel = "";
    let selectedClassKey = "";
    let finalScore = 0;
    
    let totalTimeInSeconds = 0;
    let timerInterval = null;
    let isTimeOver = false;
    let hasSentReport = false;
    let isProtectionLoopActive = false;

    window.onload = async function() {
        try {
            const response = await fetch('questions.json');
            allClassData = await response.json();
        } catch(e) { console.error(e); }
    }

    // --- AUTOMATIC SESSION TERMINATION ENGINE ---
    document.addEventListener("visibilitychange", function() {
        if (isProtectionLoopActive && document.hidden) {
            executeAutoLogoutAction();
        }
    });

    window.addEventListener("blur", function() {
        if (isProtectionLoopActive) {
            executeAutoLogoutAction();
        }
    });

    function executeAutoLogoutAction() {
        isProtectionLoopActive = false;
        clearInterval(timerInterval);
        
        document.getElementById("anti-cheat-blindfold").style.display = "block";
        
        setTimeout(() => {
            document.getElementById("anti-cheat-blindfold").style.display = "none";
            document.getElementById("quiz-box").style.display = "none";
            document.getElementById("navigation-tabs-hub").style.display = "flex";
            document.getElementById("student-portal-section").style.display = "block";
            
            userAnswers = [];
            currentQuestionIdx = 0;
            
            alert("⚠️ SECURITY SIGNAL: Window minimized or exited. Active exam token destroyed. 1 entry ticket consumed!");
        }, 1200);
    }

    function triggerPermanentLockdownUI() {
        document.getElementById("navigation-tabs-hub").style.display = "none";
        document.getElementById("student-portal-section").style.display = "none";
        document.getElementById("admin-portal-section").style.display = "none";
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-box").style.display = "none";
        document.getElementById("permanent-lockdown-box").style.display = "block";
    }

    // --- HARDENED MASTER UNLOCK FUNCTION ---
    function handleDeviceUnlock() {
        const masterKeyInput = document.getElementById("unlock-master-key").value.trim();
        if (masterKeyInput === MASTER_TEACHER_PASSWORD) {
            // Clear the specific student profile block if data exists
            if (studentRoll && selectedClassKey) {
                let trackingKey = `attempts_${studentRoll.replace(/\s+/g, '_')}_${selectedClassKey}`;
                localStorage.removeItem(trackingKey);
            } else {
                // ABSOLUTE BYPASS: If variables are lost, wipe all attempt records to instantly restore app access
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith("attempts_")) {
                        localStorage.removeItem(key);
                    }
                });
            }
            alert("✅ Authorization accepted. All matching entry limits successfully reset.");
            location.reload();
        } else {
            alert("❌ Incorrect Teacher Unlock Code!");
        }
    }

    function switchPortalView(targetView) {
        document.getElementById("tab-student").classList.remove("active");
        document.getElementById("tab-admin").classList.remove("active");
        if(targetView === 'student') {
            document.getElementById("tab-student").classList.add("active");
            document.getElementById("student-portal-section").style.display = "block";
            document.getElementById("admin-portal-section").style.display = "none";
        } else {
            document.getElementById("tab-admin").classList.add("active");
            document.getElementById("student-portal-section").style.display = "none";
            document.getElementById("admin-portal-section").style.display = "block";
            document.getElementById("admin-master-key").value = "";
        }
    }

    function exitAdminDashboard() { switchPortalView('student'); }

    async function handleLogin() {
        const inputName = document.getElementById("login-name").value.trim();
        const inputRoll = document.getElementById("login-roll").value.trim();
        selectedClassKey = document.getElementById("student-class").value;
        selectedClassLabel = document.getElementById("student-class").options[document.getElementById("student-class").selectedIndex].text;

        if(!inputName || !inputRoll) { return alert("Fill out credentials!"); }
        studentName = inputName; studentRoll = inputRoll;

        let trackingKey = `attempts_${studentRoll.replace(/\s+/g, '_')}_${selectedClassKey}`;
        let attempts = parseInt(localStorage.getItem(trackingKey)) || 0;
        
        if (attempts >= 3) {
            triggerPermanentLockdownUI();
            return;
        }

        localStorage.setItem(trackingKey, attempts + 1);

        if(!allClassData) {
            const response = await fetch('questions.json');
            allClassData = await response.json();
        }
        
        quizData = allClassData[selectedClassKey];
        userAnswers = new Array(quizData.length).fill(null);
        totalTimeInSeconds = quizData.length * 60;
        isProtectionLoopActive = true;

        document.getElementById("navigation-tabs-hub").style.display = "none";
        document.getElementById("student-portal-section").style.display = "none";
        document.getElementById("quiz-box").style.display = "block";
        
        loadQuestion();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            totalTimeInSeconds--;
            const min = Math.floor(totalTimeInSeconds / 60);
            const sec = totalTimeInSeconds % 60;
            document.getElementById("timer-box").innerText = `Time Left: ${min}:${sec < 10 ? '0'+sec : sec}`;
            if (totalTimeInSeconds <= 0) {
                clearInterval(timerInterval);
                isTimeOver = true;
                calculateAndShowResults(true);
            }
        }, 1000);
    }

    function transformToAntiLensLayout(plainText) {
        const rawWordsArray = plainText.split(" ");
        let combinedStringOutput = "";

        rawWordsArray.forEach((word) => {
            if(word.length === 0) return;
            
            let prefixChar = word.charAt(0);
            let suffixChar = word.length > 1 ? word.charAt(word.length - 1) : "";
            let remainingCore = word.length > 2 ? word.substring(1, word.length - 1) : (word.length === 2 ? "" : "");

            if (word.length === 1) {
                prefixChar = ""; suffixChar = ""; remainingCore = word;
            }

            combinedStringOutput += `<span class="lens-blind-word" data-prefix="${prefixChar}" data-suffix="${suffixChar}">${remainingCore}</span>`;
        });
        
        return combinedStringOutput;
    }

    function secureCodeBoxFormat(codeSnippet) {
        if(!codeSnippet) return "";
        let lines = codeSnippet.split("\n");
        let formattedLines = lines.map(line => `<span>${line}</span>`).join("\n");
        return `<div class="code-box">${formattedLines}</div>`;
    }

    function loadQuestion() {
        if (isTimeOver) return;
        const currentQuiz = quizData[currentQuestionIdx];
        document.getElementById("progress-text").innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
        
        const plaintextString = `Q${currentQuestionIdx + 1}. ${currentQuiz.question}`;
        document.getElementById("secure-question-host").innerHTML = transformToAntiLensLayout(plaintextString);
        
        const codeContainer = document.getElementById("code-container");
        if (currentQuiz.code) {
            codeContainer.innerHTML = secureCodeBoxFormat(currentQuiz.code);
        } else { codeContainer.innerHTML = ""; }

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const container = document.createElement("div");
            container.className = "option-container";
            container.onclick = () => selectOption(index);

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "quiz-option";
            radio.id = `opt-${index}`;
            if (userAnswers[currentQuestionIdx] === index) radio.checked = true;

            const label = document.createElement("label");
            label.className = "option-label";
            label.innerHTML = transformToAntiLensLayout(option);

            container.appendChild(radio);
            container.appendChild(label);
            optionsContainer.appendChild(container);
        });

        document.getElementById("prev-btn").disabled = (currentQuestionIdx === 0);
        const nextBtn = document.getElementById("next-btn");
        if (currentQuestionIdx === quizData.length - 1) {
            nextBtn.innerText = "Submit Quiz";
            nextBtn.className = "btn btn-submit";
        } else {
            nextBtn.innerText = "Next";
            nextBtn.className = "btn btn-next";
        }
    }

    function selectOption(index) {
        if (isTimeOver) return;
        userAnswers[currentQuestionIdx] = index;
        const r = document.getElementById(`opt-${index}`);
        if(r) r.checked = true;
    }

    function goPrevious() { if (currentQuestionIdx > 0 && !isTimeOver) { currentQuestionIdx--; loadQuestion(); } }
    
    function goNext() {
        if (isTimeOver) return;
        if (currentQuestionIdx < quizData.length - 1) { currentQuestionIdx++; loadQuestion(); }
        else { calculateAndShowResults(false); }
    }

    function calculateAndShowResults(forced) {
        clearInterval(timerInterval);
        isProtectionLoopActive = false;
        let score = 0;
        userAnswers.forEach((ans, index) => { if (ans === quizData[index].correct) score++; });

        finalScore = score;
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        document.getElementById("score-text").innerText = `Course: ${selectedClassLabel}\nStudent: ${studentName}\nRoll No: ${studentRoll}\nFinal Score: ${score} / ${quizData.length}`;
    }

    function sendToTeacher() {
        let answersString = userAnswers.map(x => x === null ? 'X' : x).join(',');
        let reportText = `*QUIZ DATA PACKET*\nName: ${studentName}\nRoll: ${studentRoll}\nClassKey: ${selectedClassKey}\nScore: ${finalScore}/${quizData.length}\nDataKey: [${answersString}]`;
        isProtectionLoopActive = false; 
        hasSentReport = true;
        document.getElementById("reset-app-btn").disabled = false;
        document.getElementById("lock-notice").style.display = "none";
        window.location.href = `whatsapp://send?phone=${TEACHER_PHONE}&text=${encodeURIComponent(reportText)}`; 
    }

    function restartQuiz() {
        if (!hasSentReport) return;
        location.reload();
    }

    function verifyAdminLogin() {
        if(document.getElementById("admin-master-key").value.trim() === MASTER_TEACHER_PASSWORD) {
            document.getElementById("admin-lockscreen").style.display = "none";
            document.getElementById("teacher-box").style.display = "block";
            renderTeacherLogs();
        } else {
            alert("❌ Incorrect Admin Password Code!");
        }
    }

    function importStudentCode() {
        const rawInput = document.getElementById("compressed-input").value.trim();
        if(!rawInput) return;
        try {
            const lines = rawInput.split('\n');
            let name = lines.find(l => l.startsWith("Name:")).replace("Name:", "").trim();
            let roll = lines.find(l => l.startsWith("Roll:")).replace("Roll:", "").trim();
            let cKey = lines.find(l => l.startsWith("ClassKey:")).replace("ClassKey:", "").trim();
            let score = lines.find(l => l.startsWith("Score:")).replace("Score:", "").trim();
            let rawDataKey = lines.find(l => l.startsWith("DataKey:")).match(/\[(.*?)\]/)[1];
            
            let parsedAnswersArray = rawDataKey.split(',').map(x => x === 'X' ? null : parseInt(x));
            let referenceQuizSet = allClassData[cKey];
            let constructedSheet = [];

            referenceQuizSet.forEach((item, index) => {
                let studentAnsIndex = parsedAnswersArray[index];
                let isCorrect = (studentAnsIndex === item.correct);
                constructedSheet.push({ qNum: index + 1, qText: item.question, ticked: studentAnsIndex !== null ? item.options[studentAnsIndex] : "Not Attempted", correctOption: item.options[item.correct], status: isCorrect });
            });

            let sharedLogs = JSON.parse(localStorage.getItem("teacher_central_database")) || [];
            sharedLogs = sharedLogs.filter(log => !(log.roll === roll && log.classKey === cKey));
            sharedLogs.push({ name: name, roll: roll, classKey: cKey, className: cKey === "class12" ? "Class 12th" : "Class 10th", score: score, timestamp: new Date().toLocaleString(), sheet: constructedSheet });
            localStorage.setItem("teacher_central_database", JSON.stringify(sharedLogs));
            document.getElementById("compressed-input").value = "";
            renderTeacherLogs();
            alert(`✅ Successfully Decoded Report Sheet for ${name}!`);
        } catch(err) { alert("❌ Format Error"); }
    }

    function renderTeacherLogs() {
        const container = document.getElementById("teacher-logs-container");
        container.innerHTML = "";
        let storedLogs = JSON.parse(localStorage.getItem("teacher_central_database")) || [];
        if(storedLogs.length === 0) {
            container.innerHTML = `<p style="text-align:center; color:#7f8c8d; font-style:italic; padding:20px;">No student records imported yet.</p>`;
            return;
        }

        for(let i = storedLogs.length - 1; i >= 0; i--) {
            let log = storedLogs[i];
            let card = document.createElement("div");
            card.className = "student-log-card";
            let sheetHtml = "";
            log.sheet.forEach(item => {
                sheetHtml += `<div style="font-size:12px; margin-top:4px; padding-left:10px; border-left:2px solid #ccc;">Q${item.qNum}: ${item.qText}<br>↳ Ticked: <span class="${item.status ? 'txt-success' : 'txt-danger'}">${item.ticked}</span></div>`;
            });
            card.innerHTML = `<strong>👤 Student:</strong> ${log.name} (Roll: ${log.roll})<br><strong>🏆 Score:</strong> ${log.score}<br><details><summary style="font-weight:bold; color:#3498db; cursor:pointer;">View Answer Details</summary>${sheetHtml}</details>`;
            container.appendChild(card);
        }
    }

    function clearTeacherLogs() { localStorage.removeItem("teacher_central_database"); renderTeacherLogs(); }
</script>
