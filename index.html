<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        /* ADD THIS FOR THE LOADING GATEKEEPER */
        #loading-overlay { 
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background:white; z-index:99999; display:flex; 
            align-items:center; justify-content:center; 
        }
    </style>
</head>
<body id="main-body-container" class="student-mode-active">

    <div id="loading-overlay"><h3>Syncing with Cloud...</h3></div>

    <script>
    // 1. GLOBAL GATEKEEPER LOCK
    let IS_SYSTEM_READY = false;

    // ... (Keep your Supabase, Constants, and Variables here) ...

    // 2. FIXED SCRAMBLE FUNCTION (Prevents "Weird Language" issue)
    function processVectorScrambleString(text) {
        if (!IS_SYSTEM_READY || !text || typeof text !== 'string') return "Loading..."; 
        return text.split('').map(char => SCRAMBLE_ALPHABET_MAP[char] || char).join('');
    }

    // 3. FIXED DATA FETCH (Prevents "Verification Failed" race condition)
    async function fetchFreshQuestions() {
        try {
            const response = await fetch(`questions.json?v=${Date.now()}`);
            if (!response.ok) throw new Error("Sync failed");
            allClassData = await response.json();
            
            IS_SYSTEM_READY = true; // Unlock the gate
            document.getElementById('loading-overlay').style.display = 'none';
            console.log("System Ready: Sync Complete");
        } catch(e) {
            console.error(e);
            document.getElementById('loading-overlay').innerHTML = "<h3>Sync Failed. Please check connection.</h3>";
        }
    }

    // 4. FIXED LOGIN GATEKEEPER
    async function handleLogin() {
        if (!IS_SYSTEM_READY) {
            alert("App is still syncing with the cloud. Please wait a few seconds.");
            return;
        }

        // ... (Keep your existing login logic here) ...
    }

    // 5. INITIALIZATION
    window.onload = async function() {
        initializeSecureRegistry();
        updateRollLimits(); 
        await fetchFreshQuestions(); 
    }

    // ... (Keep the rest of your original 900 lines of code below) ...
</script>
