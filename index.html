<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna's IP Masterclass</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .quiz-container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 6px 15px rgba(0,0,0,0.08); border-top: 6px solid #2c3e50; }
        .teacher-brand { text-align: center; margin-bottom: 5px; font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: #7f8c8d; font-weight: bold; }
        h1 { color: #2c3e50; text-align: center; font-size: 26px; margin-top: 0; margin-bottom: 25px; }
        
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; background: #eef2f7; padding: 10px 15px; border-radius: 6px; }
        #progress-text { font-size: 14px; color: #2c3e50; font-weight: bold; }
        #timer-box { font-size: 16px; color: #c0392b; font-weight: bold; background: #fde8e7; padding: 4px 10px; border-radius: 4px; border: 1px solid #f5c2c2; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #2c3e50; }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #fff; }
        
        .code-box { background: #272822; color: #f8f8f2; padding: 14px; border-radius: 6px; font-family: 'Consolas', 'Courier New', Courier, monospace; white-space: pre-wrap; margin: 15px 0; overflow-x: auto; font-size: 15px; border-left: 4px solid #3498db; }
        .option-container { display: flex; align-items: center; padding: 12px; margin: 10px 0; border: 1px solid #dcdde1; border-radius: 6px; background: #fff; cursor: pointer; transition: all 0.2s ease; }
        .option-container:hover { background: #e8f1f5; border-color: #3498db; }
        .option-container input[type="radio"] { margin-right: 15px; width: 20px; height: 20px; cursor: pointer; accent-color: #2c3e50; }
        .option-label { font-size: 16px; cursor: pointer; width: 100%; }
        
        .nav-actions { display: flex; justify-content: space-between; margin-top: 25px; gap: 10px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn-prev { background: #7f8c8d; color: white; }
        .btn-prev:hover { background: #95a5a6; }
        .btn-prev:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-next { background: #3498db; color: white; }
        .btn-next:hover { background: #2980b9; }
        .btn-submit { background: #2ecc71; color: white; }
        .btn-submit:hover { background: #27ae60; }
        
        .btn-whatsapp { background: #25D366; color: white; width: 100%; padding: 14px; font-size: 18px; margin-top: 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; text-align: center; }
        .btn-whatsapp:hover { background: #20ba5a; }
        .restart-btn { display: block; width: 100%; padding: 14px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .restart-btn:disabled { background: #bdc3c7; cursor: not-allowed; opacity: 0.6; }
        
        .score-box { text-align: center; font-size: 22px; font-weight: bold; color: #2ecc71; }
        .warning-text { color: #c0392b; font-size: 13px; margin-top: 5px; font-weight: bold; }
        
        .detailed-report-card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 20px; max-height: 250px; overflow-y: auto; text-align: left; }
        .report-item { border-bottom: 1px dashed #ccc; padding: 10px 0; font-size: 14px; }
        .report-item:last-child { border-bottom: none; }
        .txt-success { color: #2ecc71; font-weight: bold; }
        .txt-danger { color: #e74c3c; font-weight: bold; }

        .teacher-panel { background: #fff; border: 2px solid #2c3e50; border-radius: 8px; padding: 20px; margin-top: 20px; text-align: left; }
        .student-log-card { background: #f1f2f6; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 5px solid #2c3e50; }
        .btn-danger { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="teacher-brand">Krishna Kumar Presents</div>
    <h1>Class XII IP Masterclass</h1>
    
    <div id="login-box">
        <div class="input-group">
            <label for="student-name">Student Full Name:</label>
            <input type="text" id="student-name" placeholder="Enter name (Or 'ADMIN' for Dashboard)">
        </div>
        <div class="input-group">
            <label for="student-roll">Roll Number / ID:</label>
            <input type="text" id="student-roll" placeholder="Enter roll number">
        </div>
        <div class="input-group">
            <label for="student-class">Select Your Class:</label>
            <select id="student-class">
                <option value="class10">Class 10th</option>
                <option value="class11">Class 11th</option>
                <option value="class12" selected>Class 12th (Informatics Practices)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="class-password">Class Password / Admin Pass:</label>
            <input type="password" id="class-password" placeholder="Enter password">
            <div class="warning-text">⚠️ Note: Max 2 exam attempts allowed per class!</div>
        </div>
        <button class="btn btn-next" style="width:100%; margin-top:10px;" onclick="verifyAndStart()">Validate & Start Test</button>
    </div>
    
    <div id="quiz-box" style="display: none;">
        <div class="status-bar">
            <div id="progress-text">Question 1 of 3</div>
            <div id="timer-box">Time Left: --:--</div>
        </div>
        <h3 id="question-text">Loading question...</h3>
        <div id="code-container"></div>
        <div id="options-container"></div>
        
        <div class="nav-actions">
            <button class="btn btn-prev" id="prev-btn" onclick="goPrevious()">Previous</button>
            <button class="btn btn-next" id="next-btn" onclick="goNext()">Next</button>
        </div>
    </div>
    
    <div id="result-box" style="display: none;">
        <p class="score-box">🎉 Quiz Completed! 🎉</p>
        <p id="score-text" style="text-align: center; font-size: 18px; color: #555; line-height: 1.6; font-weight: bold;"></p>
        
        <button class="btn-whatsapp" onclick="sendToTeacher()">Send Code to KK Sir via WhatsApp 💬</button>
        
        <button class="restart-btn" id="reset-app-btn" onclick="restartQuiz()" disabled>Take Another Test (Locked 🔒)</button>
        <div id="lock-notice" style="text-align:center; font-size:12px; color:#e74c3c; margin-top:5px; font-weight:bold;">
            You must click the green WhatsApp button above to unlock this app!
        </div>
    </div>

    <div id="teacher-box" class="teacher-panel" style="display: none;">
        <h2 style="color: #2c3e50; margin-top: 0;">📋 KK Sir's Central Dashboard</h2>
        
        <div class="input-group" style="background: #eef2f7; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
            <label for="compressed-input" style="color: #2c3e50;">📥 Paste Student's WhatsApp Report Code Here:</label>
            <textarea id="compressed-input" rows="3" placeholder="Paste the text code sent by the student on WhatsApp here..." style="font-family: monospace; font-size: 13px; resize: none; margin-bottom: 10px;"></textarea>
            <button class="btn btn-submit" style="width: 100%;" onclick="importStudentCode()">Decode & Add to Evaluation Log</button>
        </div>

        <h3 style="color: #2c3e50; margin-top: 20px; border-bottom: 2px solid #2c3e50; padding-bottom: 5px;">Student Grading Log</h3>
        <div id="teacher-logs-container" style="max-height: 300px; overflow-y: auto; margin-bottom: 15px;">
            </div>

        <div style="display: flex; gap: 10px;">
            <button class="btn btn-prev" style="width: 50%;" onclick="closeTeacherDashboard()">Exit Dashboard</button>
            <button class="btn btn-danger" style="width: 50%; color: white;" onclick="clearTeacherLogs()">Clear Dashboard Data</button>
        </div>
    </div>
</div>

<script>
    const TEACHER_PHONE = "917055202223"; 
    const MASTER_TEACHER_PASSWORD = "adminkksir"; 

    const CLASS_PASSWORDS = {
        "class10": "pass10",
        "class11": "pass11",
        "class12": "pass12"
    };

    let allClassData = null;
    let quizData = []; 
    let userAnswers = [];
    let currentQuestionIdx = 0;
    let studentName = "";
    let studentRoll = "";
    let selectedClassLabel = "";
    let selectedClassKey = "";
    let finalScore = 0;
    
    let totalTimeInSeconds = 0;
    let timerInterval = null;
    let isTimeOver = false;
    let hasSentReport = false;

    // Prefetch database structure to handle validation routing later
    window.onload = async function() {
        try {
            const response = await fetch('questions.json');
            allClassData = await response.json();
        } catch(e) { console.error("Database connection initialization failure.", e); }
    }

    async function verifyAndStart() {
        studentName = document.getElementById("student-name").value.trim();
        studentRoll = document.getElementById("student-roll").value.trim();
        selectedClassKey = document.getElementById("student-class").value;
        const enteredPassword = document.getElementById("class-password").value.trim();
        
        const classSelectElement = document.getElementById("student-class");
        selectedClassLabel = classSelectElement.options[classSelectElement.selectedIndex].text;

        if (studentName === "") {
            alert("Please complete your identity inputs!");
            return;
        }

        if (studentName.toUpperCase() === "ADMIN") {
            if (enteredPassword === MASTER_TEACHER_PASSWORD) {
                openTeacherDashboard();
                return;
            } else {
                alert("❌ Incorrect Admin Password!");
                return;
            }
        }

        if (studentRoll === "" || enteredPassword === "") {
            alert("Please complete all profile details and enter your access security password!");
            return;
        }

        if (enteredPassword !== CLASS_PASSWORDS[selectedClassKey]) {
            alert("❌ Invalid Class Security Password!");
            return;
        }

        let attemptTrackingKey = `attempts_${studentRoll.replace(/\s+/g, '_')}_${selectedClassKey}`;
        let pastAttemptsCount = parseInt(localStorage.getItem(attemptTrackingKey)) || 0;

        if (pastAttemptsCount >= 2) {
            alert(`⛔ Access Denied!\nRoll No ${studentRoll} has already exhausted the maximum limit of 2 test attempts allowed for ${selectedClassLabel}.`);
            return;
        }

        localStorage.setItem(attemptTrackingKey, pastAttemptsCount + 1);

        if(!allClassData) {
            try {
                const response = await fetch('questions.json');
                allClassData = await response.json();
            } catch(e) {
                alert("Database transmission offline.");
                return;
            }
        }
        
        quizData = allClassData[selectedClassKey];
        userAnswers = new Array(quizData.length).fill(null);
        totalTimeInSeconds = quizData.length * 60;
        
        document.getElementById("login-box").style.display = "none";
        document.getElementById("quiz-box").style.display = "block";
        
        loadQuestion();
        startTimer();
    }

    function startTimer() {
        updateTimerDisplay();
        timerInterval = setInterval(() => {
            totalTimeInSeconds--;
            updateTimerDisplay();

            if (totalTimeInSeconds <= 0) {
                clearInterval(timerInterval);
                isTimeOver = true;
                alert("⏱️ Time is up! Compiling answers...");
                calculateAndShowResults(true);
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(totalTimeInSeconds / 60);
        const seconds = totalTimeInSeconds % 60;
        document.getElementById("timer-box").innerText = `Time Left: ${minutes < 10 ? "0" + minutes : minutes}:${seconds < 10 ? "0" + seconds : seconds}`;
    }

    function loadQuestion() {
        if (isTimeOver) return;

        const currentQuiz = quizData[currentQuestionIdx];
        document.getElementById("progress-text").innerText = `Question ${currentQuestionIdx + 1} of ${quizData.length}`;
        document.getElementById("question-text").innerText = `Q${currentQuestionIdx + 1}. ${currentQuiz.question}`;
        
        const codeContainer = document.getElementById("code-container");
        if (currentQuiz.code) {
            codeContainer.innerHTML = `<div class="code-box">${currentQuiz.code}</div>`;
        } else {
            codeContainer.innerHTML = "";
        }

        const optionsContainer = document.getElementById("options-container");
        optionsContainer.innerHTML = "";

        currentQuiz.options.forEach((option, index) => {
            const container = document.createElement("div");
            container.className = "option-container";
            container.onclick = () => selectOption(index);

            const radio = document.createElement("input");
            radio.type = "radio";
            radio.name = "quiz-option";
            radio.id = `opt-${index}`;
            radio.value = index;
            
            if (userAnswers[currentQuestionIdx] === index) radio.checked = true;

            const label = document.createElement("label");
            label.className = "option-label";
            label.htmlFor = `opt-${index}`;
            label.innerText = option;

            container.appendChild(radio);
            container.appendChild(label);
            optionsContainer.appendChild(container);
        });

        const prevBtn = document.getElementById("prev-btn");
        const nextBtn = document.getElementById("next-btn");
        prevBtn.disabled = (currentQuestionIdx === 0);

        if (currentQuestionIdx === quizData.length - 1) {
            nextBtn.innerText = "Submit Quiz";
            nextBtn.className = "btn btn-submit";
        } else {
            nextBtn.innerText = "Next";
            nextBtn.className = "btn btn-next";
        }
    }

    function selectOption(index) {
        if (isTimeOver) return;
        userAnswers[currentQuestionIdx] = index;
        document.getElementById(`opt-${index}`).checked = true;
    }

    function goPrevious() {
        if (currentQuestionIdx > 0 && !isTimeOver) {
            currentQuestionIdx--;
            loadQuestion();
        }
    }

    function goNext() {
        if (isTimeOver) return;
        if (currentQuestionIdx < quizData.length - 1) {
            currentQuestionIdx++;
            loadQuestion();
        } else {
            calculateAndShowResults(false);
        }
    }

    function calculateAndShowResults(forced) {
        clearInterval(timerInterval);
        let score = 0;
        let unansweredCount = 0;

        userAnswers.forEach((ans, index) => {
            if (ans === null) unansweredCount++;
            else if (ans === quizData[index].correct) score++;
        });

        if (unansweredCount > 0 && !forced) {
            const confirmSubmit = confirm(`You have left ${unansweredCount} question(s) unselected. Submit performance anyway?`);
            if (!confirmSubmit) {
                startTimer();
                return;
            }
        }

        finalScore = score;
        document.getElementById("quiz-box").style.display = "none";
        document.getElementById("result-box").style.display = "block";
        
        let statusString = forced ? "⚠️ TIME LIMIT EXPIRED!\n" : "";
        document.getElementById("score-text").innerText = `${statusString}Course: ${selectedClassLabel}\nStudent: ${studentName}\nRoll No: ${studentRoll}\nFinal Score: ${score} / ${quizData.length}`;
    }

    function sendToTeacher() {
        // COMPRESS ANSWERS ARRAY INTO A SINGLE STRING CODE: e.g., "1,0,3,null"
        let answersString = userAnswers.map(x => x === null ? 'X' : x).join(',');
        
        // BUILD SECURITY PACKET TRANSMISSION STRING
        let reportText = `*QUIZ DATA PACKET*\n`;
        reportText += `Name: ${studentName}\n`;
        reportText += `Roll: ${studentRoll}\n`;
        reportText += `ClassKey: ${selectedClassKey}\n`;
        reportText += `Score: ${finalScore}/${quizData.length}\n`;
        reportText += `DataKey: [${answersString}]`;

        const encodedMessage = encodeURIComponent(reportText);
        const whatsappUrl = `whatsapp://send?phone=${TEACHER_PHONE}&text=${encodedMessage}`;
        
        hasSentReport = true;
        document.getElementById("reset-app-btn").disabled = false;
        document.getElementById("lock-notice").style.display = "none";

        window.location.href = whatsappUrl; 
    }

    function restartQuiz() {
        if (!hasSentReport) return;
        userAnswers = [];
        currentQuestionIdx = 0;
        isTimeOver = false;
        hasSentReport = false;
        
        document.getElementById("student-name").value = "";
        document.getElementById("student-roll").value = "";
        document.getElementById("class-password").value = "";
        document.getElementById("reset-app-btn").disabled = true;
        document.getElementById("lock-notice").style.display = "block";
        
        document.getElementById("result-box").style.display = "none";
        document.getElementById("login-box").style.display = "block";
    }

    // --- TEACHER ENGINE PROTOCOLS ---
    function openTeacherDashboard() {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("teacher-box").style.display = "block";
        renderTeacherLogs();
    }

    function closeTeacherDashboard() {
        document.getElementById("teacher-box").style.display = "none";
        document.getElementById("login-box").style.display = "block";
        document.getElementById("student-name").value = "";
        document.getElementById("class-password").value = "";
    }

    function importStudentCode() {
        const rawInput = document.getElementById("compressed-input").value.trim();
        if(!rawInput) return;

        try {
            // Parse out variables using line parsing techniques
            const lines = rawInput.split('\n');
            let name = lines.find(l => l.startsWith("Name:")).replace("Name:", "").trim();
            let roll = lines.find(l => l.startsWith("Roll:")).replace("Roll:", "").trim();
            let cKey = lines.find(l => l.startsWith("ClassKey:")).replace("ClassKey:", "").trim();
            let score = lines.find(l => l.startsWith("Score:")).replace("Score:", "").trim();
            let rawDataKey = lines.find(l => l.startsWith("DataKey:")).match(/\[(.*?)\]/)[1];
            
            let parsedAnswersArray = rawDataKey.split(',').map(x => x === 'X' ? null : parseInt(x));
            
            let referenceQuizSet = allClassData[cKey];
            let constructedSheet = [];

            referenceQuizSet.forEach((item, index) => {
                let studentAnsIndex = parsedAnswersArray[index];
                let studentAnsText = studentAnsIndex !== null && studentAnsIndex !== undefined ? item.options[studentAnsIndex] : "Not Attempted";
                let isCorrect = (studentAnsIndex === item.correct);

                constructedSheet.push({
                    qNum: index + 1,
                    qText: item.question,
                    ticked: studentAnsText,
                    correctOption: item.options[item.correct],
                    status: isCorrect
                });
            });

            let sharedLogs = JSON.parse(localStorage.getItem("teacher_central_database")) || [];
            
            // Avoid duplicate additions of identical student evaluations
            sharedLogs = sharedLogs.filter(log => !(log.roll === roll && log.classKey === cKey));
            
            sharedLogs.push({
                name: name,
                roll: roll,
                classKey: cKey,
                className: cKey === "class12" ? "Class 12th" : cKey === "class11" ? "Class 11th" : "Class 10th",
                score: score,
                timestamp: new Date().toLocaleString(),
                sheet: constructedSheet
            });

            localStorage.setItem("teacher_central_database", JSON.stringify(sharedLogs));
            document.getElementById("compressed-input").value = "";
            renderTeacherLogs();
            alert(`✅ Successfully imported and decoded report sheet for ${name} (Roll No: ${roll})!`);

        } catch(err) {
            alert("❌ Invalid Data Code Format! Please make sure you copy the entire text message exactly as sent on WhatsApp.");
            console.error(err);
        }
    }

    function renderTeacherLogs() {
        const logsContainer = document.getElementById("teacher-logs-container");
        logsContainer.innerHTML = "";
        
        let storedLogs = JSON.parse(localStorage.getItem("teacher_central_database")) || [];
        
        if(storedLogs.length === 0) {
            logsContainer.innerHTML = `<p style="text-align:center; color:#7f8c8d; font-style:italic; padding:20px;">No student records imported yet. Paste a WhatsApp code above to parse results!</p>`;
            return;
        }

        for(let i = storedLogs.length - 1; i >= 0; i--) {
            let log = storedLogs[i];
            let card = document.createElement("div");
            card.className = "student-log-card";
            
            let sheetHtml = "";
            log.sheet.forEach(item => {
                sheetHtml += `<div style="font-size:12px; margin-top:4px; padding-left:10px; border-left:2px solid #ccc;">` +
                             `Q${item.qNum}: ${item.qText}<br>` +
                             `↳ Ticked: <span class="${item.status ? 'txt-success' : 'txt-danger'}">${item.ticked}</span>` +
                             (!item.status ? ` | Correct: <span class="txt-success">${item.correctOption}</span>` : '') +
                             `</div>`;
            });

            card.innerHTML = `<strong>👤 Name:</strong> ${log.name} <br>` +
                             `<strong>🔢 Roll No:</strong> ${log.roll} | <strong>📚 Course:</strong> ${log.className}<br>` +
                             `<strong>🏆 Score:</strong> <span class="txt-success">${log.score}</span><br>` +
                             `<strong>🕒 Decoded At:</strong> ${log.timestamp}<br>` +
                             `<details style="margin-top:5px; cursor:pointer;"><summary style="font-weight:bold; color:#3498db;">View Detailed Answer Sheet</summary>${sheetHtml}</details>`;
            
            logsContainer.appendChild(card);
        }
    }

    function clearTeacherLogs() {
        if(confirm("Clear your entire imported central dashboard log?")) {
            localStorage.removeItem("teacher_central_database");
            renderTeacherLogs();
        }
    }
</script>
</body>
</html>
