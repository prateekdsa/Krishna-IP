<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Public School, Najibabad - Secure Examination Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; user-select: none; }
        input, select, textarea { user-select: text; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col" oncontextmenu="return false;">

    <!-- Anti-Cheat Security Warning Modal -->
    <div id="security-warning-modal" class="fixed inset-0 bg-slate-950/80 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-md w-full p-8 text-center shadow-2xl border-4 border-red-600">
            <div class="text-red-600 text-6xl mb-3">⚠️</div>
            <h3 class="text-2xl font-black text-red-700 tracking-wide mb-2">SECURITY WARNING!</h3>
            <p id="warning-text" class="text-slate-700 text-sm mb-6 font-medium leading-relaxed">Tab switching or leaving the examination window is strictly prohibited.</p>
            <button onclick="dismissWarning()" class="w-full bg-red-600 hover:bg-red-700 text-white py-3.5 rounded-2xl font-bold transition shadow-lg text-sm">I Understand & Return</button>
        </div>
    </div>

    <!-- Dynamic Modal Container -->
    <div id="app-modal" class="fixed inset-0 bg-slate-950/70 z-50 hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-8 shadow-2xl border border-slate-200 relative max-h-[90vh] overflow-y-auto custom-scrollbar">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-700 font-black text-xl">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <!-- Main App Wrapper -->
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Header (Rendered dynamically when logged in) -->
        <header id="app-header" class="hidden bg-gradient-to-r from-blue-950 via-blue-900 to-indigo-950 text-white shadow-2xl p-4 md:px-8 flex justify-between items-center sticky top-0 z-40 border-b border-blue-800/50">
            <div class="flex items-center space-x-4">
                <div class="bg-white text-blue-950 font-black px-3 py-2 rounded-xl text-lg shadow-inner">CPS</div>
                <div>
                    <h1 class="font-extrabold text-base md:text-lg tracking-wide">CITY PUBLIC SCHOOL, NAJIBABAD</h1>
                    <p class="text-xs text-blue-300 font-medium">Secure Examination & Management Portal v5.3</p>
                </div>
            </div>
            <div id="header-user-info" class="text-sm font-medium flex items-center gap-4"></div>
        </header>

        <!-- Main Body -->
        <main class="flex-grow flex flex-col w-full">
            <div id="view-container" class="flex-grow flex flex-col"></div>
        </main>

        <!-- Footer -->
        <footer class="bg-slate-900 text-slate-400 text-xs py-5 text-center border-t border-slate-800 font-medium">
            &copy; 2026 City Public School, Najibabad. All Rights Reserved. Secure Examination Engine.
        </footer>
    </div>

    <!-- Application Script -->
    <script>
        let state = {
            currentUser: null,
            activeTab: 'users',
            warningCount: 0,
            activeExamInterval: null,
            currentAttemptExam: null,
            studentAnswers: {},
            users: JSON.parse(localStorage.getItem('cps_users')) || [
                { id: 1, role: 'Admin', class: 'N/A', name: 'POWER ADMINISTRATOR', username: 'admin' },
                { id: 2, role: 'Teacher', class: 'N/A', name: 'KRISHNA KUMAR KASHERWAL', username: 'kasherwal22' },
                { id: 3, role: 'Student', class: 'Class 9th - Section A', name: 'RAHUL KUMAR', username: 'rahul9', roll: '901' },
                { id: 4, role: 'Student', class: 'Class 10th - Section A', name: 'PRIYA SHARMA', username: 'priya10', roll: '1001' }
            ],
            exams: JSON.parse(localStorage.getItem('cps_exams')) || [
                { 
                    id: 'physics', name: 'Physics', class: 'Class 9th - Section A', status: 'LIVE', startTime: '', endTime: '',
                    questions: [
                        { id: 1, q: 'What is the SI unit of acceleration?', options: ['m/s', 'm/s²', 'kg·m/s', 'Newton'], correct: 1 },
                        { id: 2, q: 'Which law of motion gives the measure of force?', options: ['First Law', 'Second Law', 'Third Law', 'Law of Gravitation'], correct: 1 }
                    ]
                },
                { 
                    id: 'chemistry', name: 'Chemistry', class: 'Class 9th - Section A', status: 'OFFLINE', startTime: '', endTime: '',
                    questions: [
                        { id: 1, q: 'What is the chemical symbol for Gold?', options: ['Ag', 'Au', 'Pb', 'Fe'], correct: 1 }
                    ]
                },
                { 
                    id: 'mathematics', name: 'Mathematics', class: 'Class 9th - Section A', status: 'LIVE', startTime: '', endTime: '',
                    questions: [
                        { id: 1, q: 'What is the value of Pi (π) up to 2 decimal places?', options: ['3.12', '3.14', '3.16', '3.18'], correct: 1 }
                    ]
                },
                { 
                    id: 'biology', name: 'Biology', class: 'Class 9th - Section A', status: 'OFFLINE', startTime: '', endTime: '',
                    questions: [
                        { id: 1, q: 'Which cell organelle is known as the powerhouse of the cell?', options: ['Nucleus', 'Ribosome', 'Mitochondria', 'Golgi Apparatus'], correct: 2 }
                    ]
                },
                { 
                    id: 'english', name: 'English', class: 'Class 10th - Section A', status: 'LIVE', startTime: '', endTime: '',
                    questions: [
                        { id: 1, q: 'Choose the correct synonym of "Benevolent".', options: ['Malevolent', 'Kind', 'Hostile', 'Cruel'], correct: 1 }
                    ]
                },
                { 
                    id: 'computerscience', name: 'Computer Science', class: 'Class 10th - Section A', status: 'OFFLINE', startTime: '', endTime: '',
                    questions: [
                        { id: 1.0, q: 'What does HTML stand for?', options: ['Hyper Text Markup Language', 'High Tech Modern Language', 'Hyper Transfer Machine Language', 'None'], correct: 0 }
                    ]
                }
            ],
            submissions: JSON.parse(localStorage.getItem('cps_submissions')) || []
        };

        function saveState() {
            localStorage.setItem('cps_users', JSON.stringify(state.users));
            localStorage.setItem('cps_exams', JSON.stringify(state.exams));
            localStorage.setItem('cps_submissions', JSON.stringify(state.submissions));
        }

        // Live Clock Timer for Login Screen
        setInterval(() => {
            const clockEl = document.getElementById('live-clock-badge');
            if (clockEl) {
                const now = new Date();
                const d = String(now.getDate()).padStart(2, '0');
                const m = String(now.getMonth() + 1).padStart(2, '0');
                const y = now.getFullYear();
                const timeStr = now.toTimeString().split(' ')[0];
                clockEl.innerText = `${d}/${m}/${y} | ${timeStr}`;
            }
        }, 1000);

        function render() {
            const container = document.getElementById('view-container');
            const header = document.getElementById('app-header');
            const userInfo = document.getElementById('header-user-info');

            if (!state.currentUser) {
                header.classList.add('hidden');
                container.innerHTML = renderLoginScreen();
                toggleStudentFields();
                return;
            }

            header.classList.remove('hidden');
            userInfo.innerHTML = `
                <div class="hidden md:block text-right">
                    <div class="font-bold text-white">${state.currentUser.name}</div>
                    <div class="text-xs text-blue-300 capitalize font-medium">${state.currentUser.role} | ${state.currentUser.class || 'System Control'}</div>
                </div>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-md">Logout</button>
            `;

            if (state.currentUser.role === 'Admin' || state.currentUser.role === 'Teacher') {
                container.innerHTML = `<div class="p-4 md:p-8 max-w-7xl mx-auto w-full">${renderManagementDashboard()}</div>`;
            } else {
                container.innerHTML = `<div class="p-4 md:p-8 max-w-4xl mx-auto w-full">${renderStudentPortal()}</div>`;
            }
        }

        // ==================== EXACT MATCH LOGIN SCREEN ====================
        function renderLoginScreen() {
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()} | ${now.toTimeString().split(' ')[0]}`;

            return `
                <div class="min-h-screen bg-cover bg-center flex flex-col justify-between relative" style="background-image: url('https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1920&q=80')">
                    <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-sm"></div>
                    
                    <!-- Top Bar -->
                    <header class="relative z-10 p-6 flex flex-col md:flex-row justify-between items-center text-white border-b border-white/10 gap-4">
                        <h1 class="text-xl md:text-2xl font-black tracking-wider text-center md:text-left drop-shadow-md">CITY PUBLIC SCHOOL, NAJIBABAD</h1>
                        <div id="live-clock-badge" class="bg-slate-900/80 border border-white/20 px-4 py-2 rounded-2xl text-xs font-bold tracking-widest shadow-inner">
                            ${dateStr}
                        </div>
                    </header>

                    <!-- Login Box Container -->
                    <main class="relative z-10 flex-grow flex items-center justify-center p-4 my-6">
                        <div class="bg-white rounded-3xl max-w-xl w-full p-8 md:p-10 shadow-2xl border border-slate-100">
                            <div class="text-center mb-8">
                                <h2 class="text-2xl md:text-3xl font-extrabold text-blue-950">Online Examination Portal Login</h2>
                                <p class="text-xs md:text-sm text-slate-500 mt-2 font-medium">Select your role and authenticate using your registered details.</p>
                            </div>

                            <div class="space-y-5">
                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">I am a:</label>
                                        <a href="#" onclick="openRegisterModal()" class="text-xs font-bold text-blue-600 hover:underline">New User? Register Here</a>
                                    </div>
                                    <select id="login-role" onchange="toggleStudentFields()" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-semibold bg-slate-50 cursor-pointer">
                                        <option value="Student">Student</option>
                                        <option value="Teacher">Teacher</option>
                                        <option value="Admin">Admin</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">User ID / Registered Email</label>
                                    <input type="text" id="login-username" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="e.g. ADMIN or user@school.com or Full Name">
                                </div>

                                <div>
                                    <div class="flex justify-between items-center mb-2">
                                        <label class="text-xs font-extrabold text-slate-700 uppercase tracking-wider">Password</label>
                                        <a href="#" onclick="alert('Please contact school IT administrator for password reset.')" class="text-xs font-bold text-blue-600 hover:underline">Forgot Password?</a>
                                    </div>
                                    <input type="password" id="login-password" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="Enter account password">
                                </div>

                                <div id="student-extra-fields" class="space-y-5">
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">Select Class & Section</label>
                                        <select id="login-class" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-semibold bg-slate-50 cursor-pointer">
                                            <option value="Class 9th - Section A">Class 9th - Section A (Max 50 Students)</option>
                                            <option value="Class 10th - Section A">Class 10th - Section A (Max 50 Students)</option>
                                            <option value="Class 11th - Science">Class 11th - Science (Max 50 Students)</option>
                                            <option value="Class 12th - Science">Class 12th - Science (Max 50 Students)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">Enter Roll Number (1 to 50)</label>
                                        <input type="number" id="login-roll" min="1" max="50" class="w-full border border-slate-300 rounded-2xl p-4 focus:ring-2 focus:ring-blue-600 focus:outline-none text-sm font-medium bg-slate-50" placeholder="e.g. 12">
                                    </div>
                                </div>

                                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl transition shadow-xl text-sm tracking-wide mt-2">Login & Proceed</button>

                                <div class="bg-slate-50 border border-slate-200 p-4 rounded-2xl text-xs text-slate-500 space-y-1">
                                    <p class="font-bold text-slate-700">Quick Test Credentials:</p>
                                    <p>• Admin: <b>admin</b> | Teacher: <b>kasherwal22</b> | Student: <b>rahul9</b></p>
                                </div>
                            </div>
                        </div>
                    </main>

                    <!-- Footer -->
                    <footer class="relative z-10 text-slate-400 text-xs py-4 text-center border-t border-white/10 font-medium">
                        &copy; 2026 City Public School, Najibabad. All Rights Reserved. Secure Examination Engine.
                    </footer>
                </div>
            `;
        }

        function toggleStudentFields() {
            const role = document.getElementById('login-role')?.value;
            const extraFields = document.getElementById('student-extra-fields');
            if (extraFields) {
                if (role === 'Student') {
                    extraFields.classList.remove('hidden');
                } else {
                    extraFields.classList.add('hidden');
                }
            }
        }

        function handleLogin() {
            const usernameInput = document.getElementById('login-username').value.trim().toLowerCase();
            const roleInput = document.getElementById('login-role').value;
            const classInput = document.getElementById('login-class')?.value || 'Class 9th - Section A';
            const rollInput = document.getElementById('login-roll')?.value || '1';

            if (!usernameInput) { alert('Please enter User ID or username.'); return; }

            let foundUser = state.users.find(u => u.username.toLowerCase() === usernameInput && u.role === roleInput);
            if (!foundUser) {
                foundUser = {
                    id: Date.now(), 
                    role: roleInput,
                    class: roleInput === 'Student' ? classInput : 'N/A',
                    name: usernameInput.toUpperCase(), 
                    username: usernameInput,
                    roll: roleInput === 'Student' ? rollInput : undefined
                };
                state.users.push(foundUser);
                saveState();
            }
            state.currentUser = foundUser;
            render();
        }

        function logout() {
            if (state.activeExamInterval) clearInterval(state.activeExamInterval);
            state.currentUser = null;
            render();
        }

        // ==================== MANAGEMENT DASHBOARD ====================
        function renderManagementDashboard() {
            return `
                <div class="space-y-6">
                    <div class="flex flex-wrap gap-3 border-b border-slate-200 pb-4">
                        <button onclick="switchTab('users')" class="px-5 py-3 rounded-2xl font-bold text-sm transition shadow-sm ${state.activeTab === 'users' ? 'bg-blue-950 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border'}">👥 User & Teacher Management</button>
                        <button onclick="switchTab('exams')" class="px-5 py-3 rounded-2xl font-bold text-sm transition shadow-sm ${state.activeTab === 'exams' ? 'bg-blue-950 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border'}">🕒 Exam Schedules & Subjects</button>
                        <button onclick="switchTab('results')" class="px-5 py-3 rounded-2xl font-bold text-sm transition shadow-sm ${state.activeTab === 'results' ? 'bg-blue-950 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border'}">📊 Submissions & QP Upload</button>
                        <button onclick="switchTab('preview')" class="px-5 py-3 rounded-2xl font-bold text-sm transition shadow-sm ${state.activeTab === 'preview' ? 'bg-green-700 text-white shadow-md' : 'bg-white text-slate-700 hover:bg-slate-200 border'}">🔍 Live Exam Preview</button>
                    </div>

                    <div class="bg-white p-6 md:p-8 rounded-3xl shadow-xl border border-slate-200">
                        ${renderManagementTabContent()}
                    </div>
                </div>
            `;
        }

        function switchTab(tab) { state.activeTab = tab; render(); }

        function renderManagementTabContent() {
            if (state.activeTab === 'users') {
                return `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="text-2xl font-extrabold text-blue-950 mb-1">User & Teacher Management</h3>
                            <p class="text-sm text-slate-600">Manage teacher accounts, class rosters, and user privileges securely.</p>
                        </div>
                        <button onclick="openAddUserModal()" class="bg-blue-950 hover:bg-blue-900 text-white px-5 py-3 rounded-2xl font-bold text-xs shadow-lg">+ Add New User</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                        <div class="border p-6 rounded-3xl bg-slate-50">
                            <h4 class="font-black text-lg text-blue-950 mb-4">👨‍🏫 Teachers Registry</h4>
                            <div class="space-y-3">
                                ${state.users.filter(u => u.role === 'Teacher' || u.role === 'Admin').map(t => `
                                    <div class="flex justify-between items-center bg-white p-4 rounded-2xl border shadow-sm">
                                        <div>
                                            <p class="font-bold text-slate-800 text-sm">${t.name}</p>
                                            <p class="text-xs text-slate-500 font-semibold">Username: ${t.username} (${t.role})</p>
                                        </div>
                                        ${t.username !== 'admin' ? `<button onclick="deleteUser('${t.username}')" class="text-red-600 hover:text-red-800 text-xs font-bold px-3 py-1.5 bg-red-50 rounded-xl">Remove</button>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="border p-6 rounded-3xl bg-slate-50">
                            <h4 class="font-black text-lg text-blue-950 mb-4">🎓 Students Purge & Roster Control</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">Select Target Class:</label>
                                    <select id="manage-class-target" class="w-full border p-3.5 rounded-2xl text-xs bg-white font-semibold cursor-pointer">
                                        <option value="Class 9th - Section A">Class 9th - Section A</option>
                                        <option value="Class 10th - Section A">Class 10th - Section A</option>
                                        <option value="Class 11th - Science">Class 11th - Science</option>
                                        <option value="Class 12th - Science">Class 12th - Science</option>
                                    </select>
                                </div>
                                <div class="flex gap-3">
                                    <button onclick="purgeClassStudents()" class="flex-1 bg-red-600 hover:bg-red-700 text-white py-3 rounded-2xl font-bold text-xs shadow">Purge Class Students</button>
                                    <button onclick="viewClassStudentsModal()" class="flex-1 bg-blue-950 hover:bg-blue-900 text-white py-3 rounded-2xl font-bold text-xs shadow">View Roster</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.activeTab === 'exams') {
                return `
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h3 class="text-2xl font-extrabold text-blue-950 mb-1">Exam Schedules & Subject Management</h3>
                            <p class="text-sm text-slate-600">Create new subjects, set timelines, and toggle live/offline status.</p>
                        </div>
                        <button onclick="openCreateExamModal()" class="bg-blue-950 hover:bg-blue-900 text-white px-5 py-3 rounded-2xl font-bold text-xs shadow-lg">+ Create New Subject / Exam</button>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.exams.map(exam => `
                            <div class="border rounded-3xl p-6 bg-slate-50 shadow-sm flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-3">
                                        <h4 class="font-extrabold text-lg text-blue-950">${exam.name}</h4>
                                        <span class="px-3 py-1 text-xs font-black rounded-full ${exam.status === 'LIVE' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${exam.status}</span>
                                    </div>
                                    <p class="text-xs text-slate-500 mb-5 font-semibold">Class: ${exam.class} | Questions: ${exam.questions ? exam.questions.length : 0}</p>
                                    
                                    <div class="space-y-3 text-xs mb-6">
                                        <div>
                                            <label class="block font-bold text-slate-700 mb-1">Start Time:</label>
                                            <input type="datetime-local" id="start-${exam.id}" value="${exam.startTime || ''}" class="w-full border p-2.5 rounded-xl bg-white font-medium">
                                        </div>
                                        <div>
                                            <label class="block font-bold text-slate-700 mb-1">End Time:</label>
                                            <input type="datetime-local" id="end-${exam.id}" value="${exam.endTime || ''}" class="w-full border p-2.5 rounded-xl bg-white font-medium">
                                        </div>
                                    </div>
                                </div>
                                <div class="flex gap-3 pt-3 border-t">
                                    <button onclick="saveExamSchedule('${exam.id}')" class="flex-1 bg-blue-950 text-white py-3 rounded-2xl text-xs font-bold shadow">Save Schedule</button>
                                    <button onclick="toggleExamStatus('${exam.id}')" class="flex-1 ${exam.status === 'LIVE' ? 'bg-red-600' : 'bg-green-600'} text-white py-3 rounded-2xl text-xs font-bold shadow">${exam.status === 'LIVE' ? 'Make Offline' : 'Make Live'}</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (state.activeTab === 'results') {
                return `
                    <h3 class="text-2xl font-extrabold text-blue-950 mb-2">Submissions & Question Paper Management</h3>
                    <p class="text-sm text-slate-600 mb-8">Upload Question Papers via JSON format or download filtered evaluation results.</p>
                    
                    <div class="space-y-8">
                        <div class="p-8 border rounded-3xl bg-slate-50">
                            <h4 class="font-black text-lg text-blue-950 mb-4">📁 Upload Structured Question Paper (.json)</h4>
                            <p class="text-xs text-slate-600 mb-4">Format required: <code class="bg-slate-200 px-2 py-1 rounded">[{"id":1, "q":"Question?", "options":["A","B","C","D"], "correct":0}]</code></p>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">Select Subject:</label>
                                    <select id="qp-subject-target" class="w-full border p-3.5 rounded-2xl text-xs bg-white font-semibold cursor-pointer">
                                        ${state.exams.map(e => `<option value="${e.id}">${e.name} (${e.class})</option>`).join('')}
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">Select JSON File:</label>
                                    <input type="file" id="qp-file-field" accept=".json" class="w-full border p-2.5 rounded-2xl text-xs bg-white font-medium">
                                </div>
                                <div>
                                    <button onclick="uploadAndParseQP()" class="w-full bg-blue-950 text-white py-3.5 rounded-2xl text-xs font-bold shadow">Upload & Parse QP</button>
                                </div>
                            </div>
                        </div>

                        <div class="p-8 border rounded-3xl bg-slate-50">
                            <div class="flex justify-between items-center mb-6">
                                <h4 class="font-black text-lg text-blue-950">📋 Student Submissions & Scores</h4>
                                <button onclick="exportCSV()" class="bg-green-700 text-white px-6 py-3 rounded-2xl text-xs font-bold shadow">Download CSV</button>
                            </div>
                            <div class="overflow-x-auto border rounded-2xl bg-white">
                                <table class="w-full text-left text-xs">
                                    <thead class="bg-slate-100 border-b font-bold">
                                        <tr><th class="p-4">Student Name</th><th class="p-4">Subject</th><th class="p-4">Score</th><th class="p-4">Time</th></tr>
                                    </thead>
                                    <tbody class="divide-y">
                                        ${state.submissions.length === 0 ? `<tr><td colspan="4" class="p-6 text-center text-slate-500 font-medium">No submissions yet.</td></tr>` : state.submissions.map(s => `
                                            <tr><td class="p-4 font-bold">${s.name}</td><td class="p-4">${s.subject}</td><td class="p-4 font-black text-blue-950">${s.score}</td><td class="p-4 text-slate-500">${s.time}</td></tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.activeTab === 'preview') {
                return `
                    <h3 class="text-2xl font-extrabold text-blue-950 mb-2">🔍 Live Exam Preview</h3>
                    <p class="text-sm text-slate-600 mb-8">Inspect how question papers appear to enrolled students.</p>
                    <div class="flex gap-4 mb-6 items-end bg-slate-50 p-6 border rounded-3xl">
                        <div class="flex-grow">
                            <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">Select Subject:</label>
                            <select id="preview-sub-target" class="w-full border p-3.5 rounded-2xl text-xs bg-white font-semibold cursor-pointer">
                                ${state.exams.map(e => `<option value="${e.id}">${e.name} (${e.class})</option>`).join('')}
                            </select>
                        </div>
                        <button onclick="runPreview()" class="bg-blue-950 text-white px-8 py-3.5 rounded-2xl text-xs font-bold shadow">Run Preview</button>
                    </div>
                    <div id="preview-box" class="border p-8 rounded-3xl bg-white shadow-xl hidden">
                        <h4 id="preview-title" class="font-black text-xl text-blue-950 mb-4 border-b pb-3"></h4>
                        <div id="preview-content" class="space-y-6"></div>
                    </div>
                `;
            }
        }

        // ==================== MODAL SYSTEM ====================
        function showModal(htmlContent) {
            document.getElementById('modal-content').innerHTML = htmlContent;
            document.getElementById('app-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('app-modal').classList.add('hidden');
        }

        function viewClassStudentsModal() {
            const cls = document.getElementById('manage-class-target').value;
            const students = state.users.filter(u => u.role === 'Student' && u.class === cls);
            showModal(`
                <h3 class="text-xl font-black text-blue-950 mb-4">Roster: ${cls}</h3>
                <ul class="space-y-3 mb-6">
                    ${students.length === 0 ? '<li class="text-slate-500 text-xs">No students found.</li>' : students.map(s => `
                        <li class="p-3 bg-slate-50 rounded-xl border flex justify-between items-center text-xs">
                            <span class="font-bold text-slate-800">${s.name}</span>
                            <span class="text-slate-500">ID: ${s.username} (Roll: ${s.roll || 'N/A'})</span>
                        </li>
                    `).join('')}
                </ul>
                <button onclick="closeModal()" class="w-full bg-blue-950 text-white py-3 rounded-xl font-bold text-xs">Close Window</button>
            `);
        }

        function openCreateExamModal() {
            showModal(`
                <h3 class="text-xl font-black text-blue-950 mb-4">Create New Subject / Exam</h3>
                <div class="space-y-4 mb-6 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Subject Name:</label>
                        <input type="text" id="new-exam-name" class="w-full border p-3 rounded-xl bg-slate-50 font-medium" placeholder="e.g. Social Science">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Target Class:</label>
                        <select id="new-exam-class" class="w-full border p-3 rounded-xl bg-slate-50 font-semibold cursor-pointer">
                            <option value="Class 9th - Section A">Class 9th - Section A</option>
                            <option value="Class 10th - Section A">Class 10th - Section A</option>
                            <option value="Class 11th - Science">Class 11th - Science</option>
                            <option value="Class 12th - Science">Class 12th - Science</option>
                        </select>
                    </div>
                </div>
                <button onclick="submitNewExam()" class="w-full bg-blue-950 text-white py-3 rounded-xl font-bold text-xs">Create Exam</button>
            `);
        }

        function submitNewExam() {
            const name = document.getElementById('new-exam-name').value.trim();
            const cls = document.getElementById('new-exam-class').value;
            if (!name) { alert('Please enter a subject name.'); return; }
            const id = name.toLowerCase().replace(/\s+/g, '');
            if (state.exams.some(e => e.id === id)) { alert('Exam for this subject already exists.'); return; }

            state.exams.push({
                id: id,
                name: name,
                class: cls,
                status: 'OFFLINE',
                startTime: '',
                endTime: '',
                questions: []
            });
            saveState();
            closeModal();
            render();
            alert('New exam created successfully!');
        }

        function openRegisterModal() {
            showModal(`
                <h3 class="text-xl font-black text-blue-950 mb-4">New User Registration</h3>
                <div class="space-y-4 mb-6 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Full Name:</label>
                        <input type="text" id="reg-name" class="w-full border p-3 rounded-xl bg-slate-50 font-medium" placeholder="e.g. Amit Kumar">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Username / Email ID:</label>
                        <input type="text" id="reg-username" class="w-full border p-3 rounded-xl bg-slate-50 font-medium" placeholder="e.g. amit10">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Role:</label>
                        <select id="reg-role" class="w-full border p-3 rounded-xl bg-slate-50 font-semibold cursor-pointer">
                            <option value="Student">Student</option>
                            <option value="Teacher">Teacher</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Class & Section:</label>
                        <select id="reg-class" class="w-full border p-3 rounded-xl bg-slate-50 font-semibold cursor-pointer">
                            <option value="Class 9th - Section A">Class 9th - Section A</option>
                            <option value="Class 10th - Section A">Class 10th - Section A</option>
                            <option value="Class 11th - Science">Class 11th - Science</option>
                            <option value="Class 12th - Science">Class 12th - Science</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-2">Roll Number:</label>
                        <input type="number" id="reg-roll" class="w-full border p-3 rounded-xl bg-slate-50 font-medium" placeholder="15">
                    </div>
                </div>
                <button onclick="submitRegistration()" class="w-full bg-blue-950 text-white py-3 rounded-xl font-bold text-xs">Register Account</button>
            `);
        }

        function submitRegistration() {
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim().toLowerCase();
            const role = document.getElementById('reg-role').value;
            const cls = document.getElementById('reg-class').value;
            const roll = document.getElementById('reg-roll').value.trim();

            if (!name || !username) { alert('Please fill all required fields.'); return; }
            if (state.users.some(u => u.username.toLowerCase() === username)) { alert('Username already exists.'); return; }

            state.users.push({
                id: Date.now(),
                role: role,
                class: role === 'Student' ? cls : 'N/A',
                name: name.toUpperCase(),
                username: username,
                roll: roll || '1'
            });
            saveState();
            closeModal();
            alert('Registration successful! You can now log in.');
        }

        // ==================== STUDENT PORTAL & INTERACTIVE EXAM ====================
        function renderStudentPortal() {
            return `
                <div class="bg-white p-8 md:p-10 rounded-3xl shadow-2xl border space-y-6">
                    <div class="border-b pb-6">
                        <h3 class="text-3xl font-black text-blue-950 mb-1">Welcome, ${state.currentUser.name}</h3>
                        <p class="text-sm font-semibold text-slate-600">Class: <span class="text-blue-950 font-bold">${state.currentUser.class}</span> | Roll: <span class="text-blue-950 font-bold">${state.currentUser.roll || '901'}</span></p>
                    </div>

                    <h4 class="font-extrabold text-xl text-blue-950 mb-6">Available Examinations</h4>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${state.exams.map(exam => `
                            <div class="border rounded-3xl p-6 bg-slate-50 flex flex-col justify-between shadow-sm">
                                <div>
                                    <div class="flex justify-between items-start mb-3">
                                        <h5 class="font-black text-lg text-blue-950">${exam.name}</h5>
                                        <span class="px-3 py-1 text-xs font-black rounded-full ${exam.status === 'LIVE' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${exam.status}</span>
                                    </div>
                                    <p class="text-xs text-slate-500 mb-6 font-medium">Total Questions: ${exam.questions ? exam.questions.length : 0}</p>
                                </div>
                                <button onclick="startExam('${exam.id}')" class="w-full bg-blue-950 hover:bg-blue-900 text-white py-3.5 rounded-2xl font-bold text-xs transition shadow-lg">Start Examination</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function startExam(id) {
            const exam = state.exams.find(e => e.id === id);
            if (exam.status !== 'LIVE') {
                alert('Exam is currently offline.');
                return;
            }
            if (!exam.questions || exam.questions.length === 0) {
                alert('No questions uploaded for this exam yet.');
                return;
            }

            state.currentAttemptExam = exam;
            state.studentAnswers = {};
            renderActiveExamInterface();
            setupAntiCheat();
        }

        function renderActiveExamInterface() {
            const exam = state.currentAttemptExam;
            const container = document.getElementById('view-container');
            container.innerHTML = `
                <div class="max-w-4xl mx-auto w-full p-4">
                    <div class="bg-white rounded-3xl shadow-2xl p-8 border space-y-6">
                        <div class="flex justify-between items-center border-b pb-5">
                            <div>
                                <h3 class="text-2xl font-black text-blue-950">${exam.name} - Active Test</h3>
                                <p class="text-xs font-semibold text-slate-500">Student: ${state.currentUser.name}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-black text-red-600 uppercase">Anti-Cheat Active 🛡️</div>
                                <div id="exam-timer" class="text-lg font-black text-blue-950">00:45:00 remaining</div>
                            </div>
                        </div>

                        <div class="space-y-6 max-h-[500px] overflow-y-auto p-4 custom-scrollbar">
                            ${exam.questions.map((q, qIndex) => `
                                <div class="p-6 bg-slate-50 rounded-2xl border space-y-3">
                                    <p class="font-bold text-sm text-slate-900">Q${qIndex + 1}. ${q.q}</p>
                                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        ${q.options.map((opt, optIndex) => `
                                            <label class="flex items-center space-x-3 p-3 bg-white border rounded-xl cursor-pointer hover:border-blue-600 text-xs font-medium">
                                                <input type="radio" name="q-${q.id}" value="${optIndex}" onchange="recordAnswer(${q.id}, ${optIndex})" class="text-blue-950">
                                                <span>${opt}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="text-center pt-4 border-t">
                            <button onclick="submitActiveExam()" class="bg-green-700 hover:bg-green-800 text-white font-extrabold px-10 py-4 rounded-2xl shadow-xl text-sm">Submit Final Exam</button>
                        </div>
                    </div>
                </div>
            `;

            let timeLeft = 2700;
            state.activeExamInterval = setInterval(() => {
                timeLeft--;
                let mins = Math.floor(timeLeft / 60).toString().padStart(2, '0');
                let secs = (timeLeft % 60).toString().padStart(2, '0');
                const tEl = document.getElementById('exam-timer');
                if (tEl) tEl.innerText = `00:${mins}:${secs} remaining`;
                if (timeLeft <= 0) { clearInterval(state.activeExamInterval); submitActiveExam(); }
            }, 1000);
        }

        function recordAnswer(qId, optIdx) {
            state.studentAnswers[qId] = optIdx;
        }

        function setupAntiCheat() {
            state.warningCount = 0;
            window.onblur = function() {
                state.warningCount++;
                if (state.warningCount >= 2) {
                    alert('Max warnings reached due to leaving window. Auto-submitting exam!');
                    submitActiveExam();
                } else {
                    document.getElementById('security-warning-modal').classList.remove('hidden');
                    document.getElementById('warning-text').innerText = `Warning ${state.warningCount}/2: Leaving exam window is prohibited!`;
                }
            };
        }

        function dismissWarning() { document.getElementById('security-warning-modal').classList.add('hidden'); }

        function submitActiveExam() {
            if (state.activeExamInterval) clearInterval(state.activeExamInterval);
            window.onblur = null;

            const exam = state.currentAttemptExam;
            let score = 0;
            if (exam && exam.questions) {
                exam.questions.forEach(q => {
                    if (state.studentAnswers[q.id] === q.correct) score++;
                });
            }
            const total = exam.questions.length;

            state.submissions.push({
                name: state.currentUser.name,
                subject: exam.name,
                score: `${score}/${total} Correct`,
                time: new Date().toLocaleString()
            });
            saveState();
            alert(`Exam submitted successfully! Your score: ${score}/${total}`);
            render();
        }

        // Helper Actions
        function saveExamSchedule(id) {
            const start = document.getElementById(`start-${id}`).value;
            const end = document.getElementById(`end-${id}`).value;
            const ex = state.exams.find(e => e.id === id);
            if (ex) { ex.startTime = start; ex.endTime = end; saveState(); alert('Schedule saved successfully!'); }
        }

        function toggleExamStatus(id) {
            const ex = state.exams.find(e => e.id === id);
            if (ex) { ex.status = ex.status === 'LIVE' ? 'OFFLINE' : 'LIVE'; saveState(); render(); }
        }

        function deleteUser(username) {
            state.users = state.users.filter(u => u.username !== username);
            saveState(); render();
        }

        function purgeClassStudents() {
            const cls = document.getElementById('manage-class-target').value;
            state.users = state.users.filter(u => u.role !== 'Student' || u.class !== cls);
            saveState();
            alert(`All students in ${cls} purged successfully.`);
        }

        function openAddUserModal() {
            const name = prompt('Enter Student Name:');
            const uname = prompt('Enter Username/ID:');
            const cls = prompt('Enter Class (e.g., Class 9th - Section A):');
            if (name && uname && cls) {
                state.users.push({ id: Date.now(), role: 'Student', class: cls, name: name.toUpperCase(), username: uname, roll: '99' });
                saveState(); render();
                alert('Student added successfully!');
            }
        }

        function exportCSV() {
            let csv = 'Name,Subject,Score,Time\n';
            state.submissions.forEach(s => csv += `"${s.name}","${s.subject}","${s.score}","${s.time}"\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'cps_submissions.csv'; a.click();
        }

        function runPreview() {
            const subId = document.getElementById('preview-sub-target').value;
            const ex = state.exams.find(e => e.id === subId);
            const box = document.getElementById('preview-box');
            document.getElementById('preview-title').innerText = `${ex.name} Preview (${ex.class})`;
            document.getElementById('preview-content').innerHTML = ex.questions && ex.questions.length > 0 ? ex.questions.map((q, i) => `
                <div class="p-4 bg-slate-50 rounded-2xl border text-xs space-y-2">
                    <p class="font-bold text-slate-900">Q${i+1}. ${q.q}</p>
                    <ul class="list-disc pl-5 space-y-1">${q.options.map((o, oi) => `<li class="${oi === q.correct ? 'text-green-700 font-bold' : 'text-slate-700'}">${o}</li>`).join('')}</ul>
                </div>
            `).join('') : '<p class="text-xs text-slate-500">No questions uploaded for this exam yet.</p>';
            box.classList.remove('hidden');
        }

        function uploadAndParseQP() {
            const subjectId = document.getElementById('qp-subject-target').value;
            const fileInput = document.getElementById('qp-file-field');
            if (fileInput.files.length === 0) { alert('Please select a JSON file.'); return; }
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsedQuestions = JSON.parse(e.target.result);
                    const exam = state.exams.find(ex => ex.id === subjectId);
                    if (exam) {
                        exam.questions = parsedQuestions;
                        saveState();
                        alert(`Question Paper successfully parsed and loaded for ${exam.name}!`);
                        render();
                    }
                } catch (err) {
                    alert('Invalid JSON format. Please ensure correct structure.');
                }
            };
            reader.readAsText(file);
        }

        render();
    </script>
</body>
</html>
